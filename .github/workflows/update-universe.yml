name: Actualizar lista de activos

# Arma scripts/config.json (S&P 500, Nasdaq-100, ADRs argentinos, ETFs y top 100 cripto de CoinMarketCap)
# y después dispara "Actualizar datos" para bajar los activos nuevos.

on:
  schedule:
    - cron: "7 21 1 * *"     # el día 1 de cada mes, 18:07 en Argentina
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/build_universe.py", ".github/workflows/update-universe.yml"]

permissions:
  contents: write   # para guardar config.json en main
  actions: write    # para disparar el workflow de datos

concurrency:
  group: update-universe
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Armar la lista
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}   # top de CoinMarketCap; sin clave usa CoinGecko
        run: python scripts/build_universe.py

      - name: Guardar si cambió
        id: save
        run: |
          git config user.name  "whatif-bot"
          git config user.email "whatif-bot@users.noreply.github.com"
          git add scripts/config.json
          if git diff --cached --quiet; then
            echo "La lista no cambió."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Lista de activos actualizada $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bajar los datos de la lista nueva
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-data.yml --ref main
