name: Prueba fuentes cripto (temporal)
on:
  push:
    branches: [main]
    paths: ["scripts/probe_crypto.py", ".github/workflows/probe-crypto.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python scripts/probe_crypto.py
      - name: Publicar resultado
        run: |
          mkdir out && mv probe.json out/ && cd out
          git init -q -b probe && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
